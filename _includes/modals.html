<!-- Portfolio Modals -->
{% for post in site.posts %}
    <div class="portfolio-modal modal fade" id="portfolioModal{{ post.modal-id }}" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-content">
            <div class="close-modal" data-dismiss="modal">
                <div class="lr">
                    <div class="rl">
                    </div>
                </div>
            </div>
            <div class="container">
                <div class="row">
                    <div class="col-lg-8 col-lg-offset-2">
                        <div class="modal-body">
                            <h2>{{ post.title }}</h2>
                            <hr class="star-primary">

                            <!-- Description and Details -->
                            <p style="text-align: left;">{{ post.description }}</p>
                            <ul class="list-inline item-details">
                                <li>Resouces:
                                    <strong><a href="http://startbootstrap.com">{{ post.client }}</a>
                                    </strong>
                                </li>
                                <li>Date:
                                    <strong><a href="http://startbootstrap.com">{{ post.project-date }}</a>
                                    </strong>
                                </li>
                                <li>Categories:
                                    <strong><a href="http://startbootstrap.com">{{ post.categories }}</a>
                                    </strong>
                                </li>
                            </ul>

                            <!-- Image Gallery -->
                            <div class="image-gallery">
                                {% for image in post.images %}
                                <img src="{{ image }}" class="img-responsive img-centered" alt="{{ post.alt }}">
                                {% endfor %}
                            </div>

                            <button type="button" class="btn btn-default" data-dismiss="modal"><i class="fa fa-times"></i> Close</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endfor %}
