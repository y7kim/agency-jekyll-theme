<!-- project Grid Section -->
<section id="project" class="bg-light-gray">
  <div class="container">
      <div class="row">
          <div class="col-lg-12 text-center">
              <h2 class="section-heading">Value</h2>
              <h3 class="section-subheading text-muted">Product system and project case studies.</h3>
          </div>
      </div>
      <div class="row">
          {% assign project_posts = site.posts | where: "categories", "Projects" %}
          {% for post in project_posts limit:3 %}
              <div class="col-md-4 col-sm-6 project-item">
                  <a href="{{ post.url }}" class="project-link">
                      <div class="project-hover">
                          <div class="project-hover-content">
                              <i class="fa fa-plus fa-3x"></i>
                          </div>
                      </div>
                      <img src="{{ site.baseurl }}/img/projects/{{ post.thumbnail }}" class="img-responsive img-centered" loading="lazy" alt="">
                  </a>
                  <div class="project-caption">
                      <h4>{{ post.title }}</h4>
                      <p class="text-muted">{{ post.subtitle }}</p>
                  </div>
              </div>
          {% endfor %}
      </div>
      <div class="text-right mt-3">
        <a href="{{ site.baseurl }}/projects/" class="btn btn-outline-dark font-weight-bold" style="font-size: 16px; color: #333; text-decoration: underline;">
            ➜ 更多
        </a>
     </div>
  </div>
</section>
